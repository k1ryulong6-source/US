<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小菅 2K 房间规划</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* Layout: a drafting table — the 3D stage fills the left, a tool drawer sits on the right (stacked under the stage on phones) */
:root{
  --paper:#eceeea;
  --panel:#f8f9f6;
  --ink:#1d2527;
  --muted:#5b6663;
  --line:#d2d7d1;
  --accent:#2b4c7e;
  --accent-ink:#ffffff;
  --accent-soft:#dfe6f1;
  --warn:#b0432c;
  --warn-soft:#f5e0d9;
  --stage:#e2e5e0;
  --f-display:"Noto Serif SC","Songti SC","Hiragino Mincho ProN",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181a; --panel:#1b2023; --ink:#e3e7e2; --muted:#98a39f; --line:#2f3739;
    --accent:#8eaee0; --accent-ink:#10161f; --accent-soft:#25324a; --warn:#ec8a72; --warn-soft:#3c2620;
    --stage:#20262a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181a; --panel:#1b2023; --ink:#e3e7e2; --muted:#98a39f; --line:#2f3739;
  --accent:#8eaee0; --accent-ink:#10161f; --accent-soft:#25324a; --warn:#ec8a72; --warn-soft:#3c2620;
  --stage:#20262a; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-body)}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand h1{font:600 18px/1.2 var(--f-display);margin:0;letter-spacing:.02em;white-space:nowrap}
.brand small{color:var(--muted);font:12px var(--f-mono);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--panel);border-color:var(--warn)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;background:var(--stage);overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font:500 11px/1.25 var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);padding:1px 5px;border-radius:4px;white-space:nowrap}
.lbl.sel,.lbl.warn.up{margin-top:-26px}
.lbl.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbl.dist{color:var(--accent);border-color:var(--accent)}
.lbl.warn{background:var(--warn);color:var(--panel);border-color:var(--warn)}
.hud{position:absolute;left:12px;bottom:10px;font:12px var(--f-mono);color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 8px;border-radius:4px;pointer-events:none}
.compass{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);pointer-events:none}
.compass i{position:absolute;left:50%;top:50%;width:2px;height:36px;margin:-18px 0 0 -1px;background:linear-gradient(var(--warn) 50%,var(--muted) 50%)}
.compass b{position:absolute;left:50%;top:50%;font:600 10px var(--f-mono);color:var(--warn);transform:translate(-50%,-30px)}
.notice{position:absolute;left:12px;right:70px;top:12px;display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:13px;max-width:560px}
.notice p{margin:0;min-width:0}
.notice button{flex:none}
.tip{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:5px 12px;border-radius:999px;font-size:13px;pointer-events:none;white-space:nowrap}
.selbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 4px 16px color-mix(in srgb,var(--ink) 18%,transparent)}
.selbar span{font-size:13px;font-weight:500;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto;max-width:180px}
.selbar span.flag{color:var(--warn)}
.selbar button{flex:none;min-width:40px;height:38px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;font:inherit;font-size:14px;cursor:pointer;padding:0 9px}
.selbar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.selbar button.danger{color:var(--warn)}
aside{width:360px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;font:inherit;font-weight:500;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:18px}
.pane h2{font:600 13px var(--f-body);letter-spacing:.06em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
.pane section{display:flex;flex-direction:column;gap:8px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.cat{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 7px;text-align:left;cursor:pointer;font:inherit;font-size:13px;line-height:1.25;min-width:0}
.cat:hover{border-color:var(--accent)}
.cat small{display:block;color:var(--muted);font:10.5px var(--f-mono);margin-top:2px}
.catname{font-size:12px;color:var(--muted);margin:4px 0 0}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.four{grid-template-columns:repeat(4,minmax(0,1fr))}
label.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type=color]{padding:1px;height:30px}
input[type=range]{padding:0;border:0;background:transparent}
input[type=checkbox]{width:auto}
textarea{font:12px/1.4 var(--f-mono);min-height:120px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.card{border:1px solid var(--line);border-radius:7px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card header{display:flex;gap:6px;align-items:center}
.card header input{font-weight:600}
.meta{font:11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;justify-content:space-between;gap:8px;padding:5px 7px;border-radius:5px;cursor:pointer;border:1px solid transparent;font-size:13px}
.li:hover{border-color:var(--line)}
.li.on{background:var(--accent-soft)}
.li .meta{white-space:nowrap}
.flag{color:var(--warn);font-weight:600}
.pill{display:inline-block;font:11px var(--f-mono);padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:7px;padding:12px;color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--panel);border-radius:8px;padding:14px;max-width:min(900px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal img{border:1px solid var(--line);border-radius:4px}
kbd{font:11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--paper)}
@media (pointer:coarse){ .hud{display:none} }
@media (max-width:820px){
  .main{flex-direction:column}
  #stage{flex:none;height:62vh;min-height:320px}
  .bar{padding:6px 12px;gap:6px 8px}
  .seg button,.btn{padding:7px 11px;font-size:14px}
  input,select,textarea{font-size:16px}
  .tip{top:auto;bottom:62px}
  .selbar{flex-wrap:wrap;justify-content:center;width:calc(100% - 24px)}
  .selbar span{flex:1 0 100%;max-width:none;text-align:center;padding:2px 6px 4px}
  .selbar button{min-width:44px;height:42px;flex:1 1 auto}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}
  .brand small{display:none}
  .notice{right:12px;font-size:12.5px}
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="brand"><h1>小菅 2K · 201</h1><small id="sizeInfo"></small></div>
    <div class="seg" role="group" aria-label="视角">
      <button type="button" data-view="3d" aria-pressed="true">3D</button>
      <button type="button" data-view="top" aria-pressed="false">平面</button>
      <button type="button" data-view="walk" aria-pressed="false">人视角</button>
    </div>
    <div class="seg" role="group" aria-label="墙高">
      <button type="button" data-walls="1" aria-pressed="true">整墙</button>
      <button type="button" data-walls="0.45" aria-pressed="false">半墙</button>
      <button type="button" data-walls="0.06" aria-pressed="false">墙线</button>
    </div>
    <button type="button" class="btn" id="measureBtn" aria-pressed="false">量尺寸</button>
    <button type="button" class="btn" id="undoBtn" title="Ctrl+Z">撤销</button>
    <button type="button" class="btn" id="shotBtn">截图</button>
  </div>
  <div class="main">
    <div id="stage">
      <div id="labels"></div>
      <div class="compass" id="compass"><i></i><b>N</b></div>
      <div class="notice" id="notice" hidden>
        <p><b>按间取图和全景图还原，误差约 ±10cm。</b>家具是示例摆放；小人身高可改，用来比对尺寸。</p>
        <button type="button" class="btn" id="noticeClose">知道了</button>
      </div>
      <div class="hud" id="hud">x — · z —</div>
      <div class="selbar" id="selbar" hidden>
        <span id="sb-name"></span>
        <button type="button" data-sb="rl" data-free aria-label="逆时针转 90 度">↺</button>
        <button type="button" data-sb="rr" data-free aria-label="顺时针转 90 度">↻</button>
        <button type="button" data-sb="dup" data-free>复制</button>
        <button type="button" data-sb="edit">尺寸</button>
        <button type="button" data-sb="del" data-free class="danger">删除</button>
        <button type="button" data-sb="done" class="primary">完成</button>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="furn" aria-selected="true">家具</button>
        <button type="button" role="tab" data-tab="rooms" aria-selected="false">房间</button>
        <button type="button" role="tab" data-tab="decor" aria-selected="false">装饰</button>
        <button type="button" role="tab" data-tab="file" aria-selected="false">保存</button>
      </div>
      <div class="pane" id="pane-furn"></div>
      <div class="pane" id="pane-rooms" hidden></div>
      <div class="pane" id="pane-decor" hidden></div>
      <div class="pane" id="pane-file" hidden></div>
    </aside>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    const A = S.items[i], ca = ITEMS[A.t] || {};
    if (!ca.inWall){
      const r = roomAt(A.x, A.z), e = halfExt(A), t = WALL_T / 2 - 0.005;
      if (r && r.type === 'stair') add(A.id, '挡住楼梯');
      else if (!r || A.x - e.hx < r.x + t || A.x + e.hx > r.x + r.w - t || A.z - e.hz < r.z + t || A.z + e.hz > r.z + r.d - t) add(A.id, '碰到墙');
    }
    if (ca.soft) continue;
    for (let j = i + 1; j < S.items.length; j++){
      const B = S.items[j], cb = ITEMS[B.t] || {};
      if (cb.soft) continue;
      const ya0 = A.y || 0, yb0 = B.y || 0;
      if (ya0 + A.h <= yb0 + 0.005 || yb0 + B.h <= ya0 + 0.005) continue;
      if (overlap2d(cs[i], cs[j])){ add(A.id, '与「' + B.name + '」重叠'); add(B.id, '与「' + A.name + '」重叠'); }
    }
  }
  for (const it of S.items){
    const g = itemObj.get(it.id); if (!g) continue;
    const bad = problems.has(it.id);
    g.traverse(o => { if (o.isMesh && o.material && o.material.emissive && !o.userData.lampGlow){ o.material.emissive.setHex(bad ? 0x7a1500 : 0x000000); o.material.emissiveIntensity = bad ? .45 : 0; } });
  }
}

let selId = null, selHelper = null;
const distLines = [];
function clearHelpers(){ disposeGroup(gHelp); selHelper = null; distLines.length = 0; }
function drawSelHelpers(){
  clearHelpers(); drawPick(); drawRoomHL(); renderSelBar();
  const it = selId && item(selId); if (!it) return;
  const cs = corners(it), y = (it.y || 0) + 0.01;
  const pts = cs.concat([cs[0]]).map(p => new THREE.Vector3(p[0], Math.max(y, .012), p[1]));
  const accent = lin(tok('--accent'));
  selHelper = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:accent, depthTest:false}));
  selHelper.renderOrder = 10; gHelp.add(selHelper);
  const r = roomAt(it.x, it.z); if (!r) return;
  const e = halfExt(it), t = WALL_T / 2;
  const segs = [
    [it.x - e.hx, it.z, r.x + t, it.z], [it.x + e.hx, it.z, r.x + r.w - t, it.z],
    [it.x, it.z - e.hz, it.x, r.z + t], [it.x, it.z + e.hz, it.x, r.z + r.d - t]
  ];
  for (const s of segs){
    const len = Math.hypot(s[2] - s[0], s[3] - s[1]);
    if (len < 0.005) continue;
    const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(s[0], .015, s[1]), new THREE.Vector3(s[2], .015, s[3])]), new THREE.LineDashedMaterial({color:accent, dashSize:.06, gapSize:.04, depthTest:false}));
    ln.computeLineDistances(); ln.renderOrder = 10; gHelp.add(ln);
    distLines.push({x:(s[0] + s[2]) / 2, z:(s[1] + s[3]) / 2, cm:cm(len)});
  }
}

  const img = new Image();

/* ---------- sun, colours ---------- */
function updateSun(){
  const th = S.northDeg * Math.PI / 180;
  const N = [Math.sin(th), -Math.cos(th)], E = [Math.cos(th), Math.sin(th)];
  const hr = clamp(S.hour, 6, 18), t = (hr - 6) / 12;
  const az = (90 + t * 180) * Math.PI / 180, el = Math.max(.12, Math.sin(t * Math.PI) * 0.95);
  const dx = N[0] * Math.cos(az) + E[0] * Math.sin(az), dz = N[1] * Math.cos(az) + E[1] * Math.sin(az);
  const b = bounds();
  sun.target.position.set(b.cx, 0, b.cz);
  sun.position.set(b.cx + dx * Math.cos(el) * 20, Math.sin(el) * 20, b.cz + dz * Math.cos(el) * 20);
  const warm = 1 - Math.sin(t * Math.PI);
  sun.color.setRGB(1, 0.96 - warm * 0.12, 0.88 - warm * 0.25);
  // after sunset the sky fades out and only the lamps you placed light the rooms
  const night = clamp((S.hour - 17.5) / 1.5, 0, 1);
  sun.intensity = (0.4 + Math.sin(t * Math.PI) * 0.45) * (1 - night);
  hemi.intensity = .55 * (1 - .85 * night);
  amb.intensity = (view === 'walk' ? .32 : .12) * (1 - .75 * night);
  $('#compass').style.transform = 'rotate(' + S.northDeg + 'deg)';
}

/* ---------- labels ---------- */
const labelsEl = $('#labels'); const lblPool = [];
function project(x, y, z){
  const v = new THREE.Vector3(x, y, z).project(cam);
  if (v.z > 1 || v.z < -1) return null;
  return [(v.x + 1) / 2 * stage.clientWidth, (1 - v.y) / 2 * stage.clientHeight];
}
function renderLabels(){
  const L = [];
  const it = selId && item(selId);
  if (it){
    const bad = problems.get(it.id);
    L.push({x:it.x, y:(it.y || 0) + it.h + .12, z:it.z, cls:bad ? 'warn up' : 'sel', html:esc(it.name) + ' ' + cm(it.w) + '×' + cm(it.d) + '×' + cm(it.h) + (bad ? ' · ' + esc(bad[0]) : '')});
    for (const d of distLines) L.push({x:d.x, y:.02, z:d.z, cls:'dist', html:d.cm + ''});
  }
  if (measure) L.push({x:(measure.a.x + measure.b.x) / 2, y:.05, z:(measure.a.z + measure.b.z) / 2, cls:'warn', html:measure.cm + ' cm'});
  while (lblPool.length < L.length){ const d = document.createElement('div'); labelsEl.appendChild(d); lblPool.push(d); }
  lblPool.forEach((el, i) => {
    const l = L[i];
    if (!l){ el.hidden = true; return; }
    const p = project(l.x, l.y, l.z);
    if (!p){ el.hidden = true; return; }
    el.hidden = false; el.className = 'lbl ' + l.cls;
    if (el._h !== l.html){ el.innerHTML = l.html; el._h = l.html; }
    el.style.left = p[0] + 'px'; el.style.top = p[1] + 'px';
  });
}

/* ---------- main loop ---------- */
const keys = new Set();
function loop(){
  requestAnimationFrame(loop);
  if (view === 'walk' && keys.size){
    const f = new THREE.Vector3().subVectors(ctlP.target, persp.position); f.y = 0; f.normalize();
    const rgt = new THREE.Vector3(-f.z, 0, f.x), sp = 0.035, mv = new THREE.Vector3();
    if (keys.has('ArrowUp') || keys.has('w')) mv.add(f); if (keys.has('ArrowDown') || keys.has('s')) mv.sub(f);
    if (keys.has('ArrowRight') || keys.has('d')) mv.add(rgt); if (keys.has('ArrowLeft') || keys.has('a')) mv.sub(rgt);
    mv.multiplyScalar(sp); persp.position.add(mv); ctlP.target.add(mv);
  }
  ctl.update();
  renderer.render(scene, cam);
  renderLabels();
}

/* bind number inputs in cm to state fields in metres */
function bindNum(root, obj, onLive, onDone){
  root.querySelectorAll('[data-k]').forEach(inp => {
    const k = inp.dataset.k, unit = inp.dataset.u || 'cm';
    const read = () => {
      if (inp.type === 'checkbox') return inp.checked;
      if (inp.type === 'number' || inp.type === 'range'){ const v = parseFloat(inp.value); if (!isFinite(v)) return null; return unit === 'cm' ? v / 100 : v; }
      return inp.value;
    };
    inp.addEventListener('input', () => { const v = read(); if (v === null) return; obj[k] = v; onLive && onLive(k); });
    inp.addEventListener('change', () => { onDone && onDone(k); commit(); });
  });
}

    S.rooms.push(r); roomHL = r.id; rebuildStructure(); commit(); renderRooms();
  });
  $('#o-add').addEventListener('click', () => {
    const r = S.rooms.find(r => r.id === roomHL) || S.rooms.find(r => r.type === 'room') || S.rooms[0];
    const o = O('window', 'h', r ? r.x + r.w / 2 : 1, r ? r.z + r.d : 0, .9, 1.1, .9);
    S.openings.push(o); roomHL = o.id; rebuildStructure(); commit(); renderRooms();
  });
}
function areaText(r){ const a = r.w * r.d; return a.toFixed(2) + ' m² · ' + (a / JO).toFixed(1) + ' 帖'; }
function hl(id, card){
  if (roomHL === id) return;
  roomHL = id; drawSelHelpers();
  document.querySelectorAll('#pane-rooms .card.on').forEach(c => { if (c !== card && !c.querySelector('#u-real')) c.classList.remove('on'); });
  card.classList.add('on');
}
function loadUnderlay(file){
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1600, k = Math.min(1, maxW / img.naturalWidth);
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const b = bounds();
      S.underlay = {src:c.toDataURL('image/jpeg', .85), width:Math.max(b.w, 4), x:b.x0, z:b.z0, opacity:.6, show:true};
      buildUnderlay(); commit(); renderRooms();
      setWalls(0.06); setView('top');
      showTip('底图已放上。先用「两点定比例」校准尺寸', 5000);
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- decor pane ---------- */
function renderDecor(){
  const p = $('#pane-decor');
  let h = '<section><h2>墙面颜色</h2><div class="swatches">' + WALL_COLORS.map(c => '<button type="button" class="sw" data-wall="' + c + '" style="background:' + c + '" aria-label="墙色 ' + c + '" aria-pressed="' + (c === S.wallColor) + '"></button>').join('') +
    '</div><label class="f">自定义<input type="color" id="d-wall" value="' + S.wallColor + '"></label><p class="hint">租房一般不能刷墙，这里可以试贴可撕墙纸的效果。</p></section>';
  h += '<section><h2>地面</h2><p class="hint">可撕地板贴、地毯的效果可以在这里试。</p>';
  for (const r of S.rooms){
    const tints = FLOOR_TINTS[r.floor] || [];
    h += '<div class="card" data-froom="' + r.id + '"><header><b>' + esc(r.name) + '</b></header><div class="fields two"><label class="f">材质<select data-fk>' + Object.entries(FLOORS).map(([k, v]) => '<option value="' + k + '"' + (k === r.floor ? ' selected' : '') + '>' + v.n + '</option>').join('') + '</select></label>' +
      '<label class="f">颜色<input type="color" data-fc value="' + (r.fc || FLOORS[r.floor].c) + '"></label></div>' +
      '<div class="swatches">' + tints.map(c => '<button type="button" class="sw" data-tint="' + c + '" style="background:' + c + '" aria-label="地面颜色 ' + c + '" aria-pressed="' + (c === r.fc) + '"></button>').join('') + '</div></div>';
  }
  h += '</section><section><h2>采光</h2><div class="fields two">' +
    '<label class="f">时间 <span class="meta" id="d-hour-v">' + fmtHour(S.hour) + '</span><input type="range" id="d-hour" min="6" max="22" step="0.25" value="' + S.hour + '"></label>' +
    '<label class="f">北方朝向<select id="d-north">' + [[0, '平面图上方'], [90, '平面图右方'], [180, '平面图下方'], [270, '平面图左方'], [45, '右上'], [135, '右下'], [225, '左下'], [315, '左上']].map(([v, n]) => '<option value="' + v + '"' + (v === S.northDeg ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label></div>' +
    '<p class="hint">时间拖到 18:00 以后是夜晚：天光消失，只剩你放的落地灯、纸灯、灯带和上照灯。把北方设对，阳光从窗户照进来的方向就和实际一致。SUUMO 的「向き」写的是主窗朝向，比如「南」就是阳台朝南。</p></section>';
  p.innerHTML = h;
  const setWall = c => { S.wallColor = c; if (wallMat) wallMat.color.copy(lin(c)); };
  p.querySelectorAll('[data-wall]').forEach(b => b.addEventListener('click', () => { setWall(b.dataset.wall); commit(); renderDecor(); }));
  $('#d-wall').addEventListener('input', e => setWall(e.target.value));
  $('#d-wall').addEventListener('change', () => { commit(); renderDecor(); });
  p.querySelectorAll('[data-froom]').forEach(card => {
    const r = S.rooms.find(x => x.id === card.dataset.froom);
    card.querySelector('[data-fk]').addEventListener('change', e => { r.floor = e.target.value; r.fc = FLOORS[r.floor].c; buildRooms(); commit(); renderDecor(); });
    card.querySelector('[data-fc]').addEventListener('change', e => { r.fc = e.target.value; buildRooms(); commit(); renderDecor(); });
    card.querySelectorAll('[data-tint]').forEach(b => b.addEventListener('click', () => { r.fc = b.dataset.tint; buildRooms(); commit(); renderDecor(); }));
  });
  $('#d-hour').addEventListener('input', e => { S.hour = parseFloat(e.target.value); $('#d-hour-v').textContent = fmtHour(S.hour); updateSun(); });
  $('#d-hour').addEventListener('change', commit);
  $('#d-north').addEventListener('change', e => { S.northDeg = parseInt(e.target.value, 10); updateSun(); commit(); });
}
function fmtHour(h){ const m = Math.round((h % 1) * 60); return Math.floor(h) + ':' + (m < 10 ? '0' : '') + m; }

/* ---------- file pane ---------- */
let resetArmed = 0;
function renderFile(){
  const p = $('#pane-file');
  p.innerHTML = '<section><h2>自动保存</h2><p class="hint" id="saveNote">' + esc(saveNote) + '</p><p class="hint">只存在这台设备的这个浏览器里。换手机或电脑前，先导出一份。</p></section>' +
    '<section><h2>导出</h2><label class="row hint"><input type="checkbox" id="x-ul"> 包含底图（文本会很长）</label><textarea id="x-out" readonly aria-label="导出的方案"></textarea><div class="row"><button type="button" class="btn primary" id="x-copy">复制方案文本</button></div></section>' +
    '<section><h2>导入</h2><p class="hint">粘贴之前复制的方案文本，或选择保存的 .json 文件。</p><textarea id="x-in" aria-label="粘贴方案文本" placeholder="{ &quot;v&quot;: 1, ... }"></textarea><div class="row"><button type="button" class="btn" id="x-load">载入粘贴的方案</button><label class="btn">选择文件<input type="file" id="x-file" accept=".json,application/json,text/plain" hidden></label></div><p class="hint flag" id="x-err" hidden></p></section>' +
    '<section><h2>重新开始</h2><p class="hint">恢复成按间取图描出的初始布局，当前方案会被替换（可以撤销）。</p><button type="button" class="btn danger" id="x-reset" style="align-self:flex-start">恢复初始布局</button></section>';
  const fill = () => { $('#x-out').value = JSON.stringify($('#x-ul').checked ? S : Object.assign({}, S, {underlay:null})); };
  fill(); $('#x-ul').addEventListener('change', fill);
  $('#x-copy').addEventListener('click', () => {
    const ta = $('#x-out'), btn = $('#x-copy');
    const done = () => { btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制方案文本', 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); btn.textContent = '已选中，请手动复制'; });
    else { ta.select(); btn.textContent = '已选中，请手动复制'; }
  });
  const importText = txt => {
    try { const s = JSON.parse(txt); if (!valid(s)) throw new Error('bad');
      if (!s.underlay && S.underlay) s.underlay = S.underlay;
      S = Object.assign(templateState(), s); selId = null; commit(); rebuildAll(); $('#x-err').hidden = true; frame3d(); renderFile();
    } catch(e){ const er = $('#x-err'); er.textContent = '没能识别这段文本，请确认是从「导出」复制的完整内容。'; er.hidden = false; }
  };
  $('#x-load').addEventListener('click', () => importText($('#x-in').value));
  $('#x-file').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => importText(rd.result); rd.readAsText(f); });
  $('#x-reset').addEventListener('click', e => {
    const b = e.currentTarget;
    if (!resetArmed){ resetArmed = setTimeout(() => { resetArmed = 0; b.classList.remove('armed'); b.textContent = '恢复初始布局'; }, 3000); b.classList.add('armed'); b.textContent = '再点一次确认'; return; }
    clearTimeout(resetArmed); resetArmed = 0;
    const ul = S.underlay; S = templateState(); S.underlay = ul; selId = null; commit(); rebuildAll(); frame3d(); renderFile();
  });
}

/* ---------- toolbar ---------- */
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
function setWalls(v){
  wallScale = v;
  document.querySelectorAll('[data-walls]').forEach(b => b.setAttribute('aria-pressed', String(parseFloat(b.dataset.walls) === v)));
  buildWalls(); buildOpenings();
}
document.querySelectorAll('[data-walls]').forEach(b => b.addEventListener('click', () => setWalls(parseFloat(b.dataset.walls))));
$('#measureBtn').addEventListener('click', () => {
  if (pickMode === 'measure'){ pickMode = null; pickPts = []; $('#measureBtn').setAttribute('aria-pressed', 'false'); hideTip(); drawSelHelpers(); return; }
  if (measure && !pickMode){ measure = null; }
  startPick('measure');
});
$('#undoBtn').addEventListener('click', undo);
$('#noticeClose').addEventListener('click', () => { S.noticeClosed = true; $('#notice').hidden = true; commit(); });
$('#shotBtn').addEventListener('click', () => {
  hideTip(); renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  const box = $('#modalBox');
  box.innerHTML = '<div class="row" style="justify-content:space-between"><b>截图</b><button type="button" class="btn" id="m-close">关闭</button></div><img alt="当前视角的房间截图" src="' + url + '"><p class="hint">手机长按图片保存；电脑右键「图片另存为」。</p>';
  $('#modal').hidden = false; $('#m-close').focus();
  $('#m-close').addEventListener('click', () => { $('#modal').hidden = true; });
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd'){ e.preventDefault(); dupSel(); return; }
  if (e.key === 'Escape'){ if (!$('#modal').hidden){ $('#modal').hidden = true; return; } if (pickMode){ pickMode = null; pickPts = []; hideTip(); $('#measureBtn').setAttribute('aria-pressed', 'false'); drawSelHelpers(); return; } select(null); return; }
  const it = selId && item(selId);
  if (view === 'walk' && !it && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)){ keys.add(e.key); e.preventDefault(); return; }
  if (!it) return;
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); delSel(); return; }
  if (e.key === 'r' || e.key === 'R'){ rotateSel(e.shiftKey ? -90 : 90); return; }
  if (e.key === 'q' || e.key === 'Q'){ rotateSel(-15); return; }
  if (e.key === 'e' || e.key === 'E'){ rotateSel(15); return; }
  const st = e.shiftKey ? .05 : .01;
  const mv = {ArrowLeft:[-st, 0], ArrowRight:[st, 0], ArrowUp:[0, -st], ArrowDown:[0, st]}[e.key];
  if (mv && !it.locked){ e.preventDefault(); it.x = Math.round((it.x + mv[0]) * 100) / 100; it.z = Math.round((it.z + mv[1]) * 100) / 100; placeItem(it); afterItemsMoved(); syncSelFields(); clearTimeout(nudgeT); nudgeT = setTimeout(commit, 400); }
});
let nudgeT = 0;
window.addEventListener('keyup', e => keys.delete(e.key));
window.addEventListener('blur', () => keys.clear());

/* ---------- boot ---------- */
function rebuildStructure(){ buildRooms(); buildWalls(); buildCeilings(); buildOpenings(); updateSun(); checkProblems(); drawSelHelpers(); updateInfo(); }
function rebuildAll(){ rebuildStructure(); buildFurniture(); buildUnderlay(); checkProblems(); drawSelHelpers(); renderPane(); $('#notice').hidden = !!S.noticeClosed; }
function updateInfo(){
  const inner = S.rooms.filter(r => r.type !== 'balcony' && r.type !== 'stair').reduce((a, r) => a + r.w * r.d, 0);
  $('#sizeInfo').textContent = '6.2万円 · 南向き · 描图面积约 ' + inner.toFixed(1) + ' m²';
}
themeColors();
rebuildAll();
resize(); frame3d();
loop();
})();
</script>
</body>
